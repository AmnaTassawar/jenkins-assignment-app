apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd4-app-deployment
  labels:
    app: pd4-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pd4-app
  template:
    metadata:
      labels:
        app: pd4-app
    spec:
      containers:
        - name: pd4-app-container
          image: 55420/jenkins-assignment-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80