
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t test-app:latest .

      - name: Test Docker Image
        run: docker image inspect test-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/jenkins-assignment-app:v5

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ vars.DOCKERHUB_USERNAME }}/jenkins-assignment-app:v5
            sudo docker stop wayfinder-app || true
            sudo docker rm wayfinder-app || true
            sudo docker run -d \
              --name wayfinder-app \
              --restart unless-stopped \
              -p 80:80 \
              ${{ vars.DOCKERHUB_USERNAME }}/jenkins-assignment-app:v5

            sudo docker ps
